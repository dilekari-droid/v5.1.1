name: V5.1.1 Final Source Consistency

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v511-final-source-consistency.yml'

permissions:
  contents: write

jobs:
  fix-verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Fix provider-weight capability consistency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          main = Path('backend/main.py')
          s = main.read_text()
          old = '            "providerWeightFormulaVerified": False,\n'
          new = '            "providerWeightFormulaVerified": _provider_weight_formula_is_verified(),\n'
          if s.count(old) != 1:
              raise SystemExit(f'expected exactly one hardcoded scanner policy provider-weight flag, found {s.count(old)}')
          s = s.replace(old, new, 1)
          # Keep the realtime-disabled response formatting explicit/readable.
          s = s.replace('            "attestationReady": False,\n    "attestationConfigured": bool(', '            "attestationReady": False,\n            "attestationConfigured": bool(', 1)
          main.write_text(s)

          tests = Path('backend/tests/test_contracts.py')
          t = tests.read_text()
          anchor = '    monkeypatch.setattr(main, "provider_capabilities", fake_caps)\n\n    response = await main.scanner_opportunities('
          replacement = '    monkeypatch.setattr(main, "provider_capabilities", fake_caps)\n    monkeypatch.setattr(main, "_provider_weight_formula_is_verified", lambda: True)\n\n    response = await main.scanner_opportunities('
          if anchor not in t:
              raise SystemExit('scanner test monkeypatch anchor missing')
          t = t.replace(anchor, replacement, 1)
          anchor2 = '    assert response["scanPolicy"]["serverBatchEnforced"] is True\n'
          replacement2 = anchor2 + '    assert response["scanPolicy"]["providerWeightFormulaVerified"] is True\n'
          if anchor2 not in t:
              raise SystemExit('scanner policy assertion anchor missing')
          t = t.replace(anchor2, replacement2, 1)
          tests.write_text(t)
          PY
          git diff --check

      - name: Source isolation and production-target guards
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'borsa-takip-v5416-final-production.up.railway.app' .github/workflows/production-e2e.yml
          grep -q 'BORSA_E2E_BASE_URL:.*vars.BORSA_E2E_BASE_URL' .github/workflows/production-e2e.yml
          if grep -R -n -E 'dilekari-droid/v6-1-1|V6\.1\.1|v611' android backend contracts .github/scripts .github/workflows --exclude='v511-final-source-consistency.yml'; then
            echo 'V6 source/reference contamination detected in V5.1.1 tree' >&2
            exit 1
          fi

      - name: Verify backend suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt pytest pytest-asyncio
          python -m py_compile backend/main.py backend/e2e_smoke.py backend/e2e_provenance.py backend/preapk_readiness.py
          (cd backend && PYTHONPATH=. python -m pytest -q)

      - name: Verify Android source remains clean
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('android/app/src/main/res/layout').glob('*.xml'))
          for path in files:
              ET.parse(path)
          print(f'XML parse PASS: {len(files)} files')
          PY
          ./android/gradlew -p android --no-daemon testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin

      - name: Commit exact verified source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v511-final-source-consistency.yml
          git add -A
          git diff --cached --check
          git commit -m 'hardening: align provider weight verification contract'
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Package exact verified source
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ steps.commit.outputs.sha }}'
          SHORT="${SHA:0:12}"
          ZIP="V5.1.1-KAYNAK-KOD-FINAL-${SHORT}.zip"
          git archive --format=zip --output="$ZIP" "$SHA"
          sha256sum "$ZIP" > "$ZIP.sha256"
          python - <<PY
          import json, pathlib
          sha = '${{ steps.commit.outputs.sha }}'
          short = sha[:12]
          payload = {
            'repository': 'dilekari-droid/v5.1.1',
            'branch': 'main',
            'sourceCommit': sha,
            'package': f'V5.1.1-KAYNAK-KOD-FINAL-{short}.zip',
            'sourceVerification': {
              'backendPyCompile': 'PASS',
              'backendPytest': 'PASS',
              'androidUnitTest': 'PASS',
              'androidKotlinCompile': 'PASS',
              'androidTestKotlinCompile': 'PASS',
              'xmlParse': 'PASS',
              'v6IsolationGuard': 'PASS',
              'productionE2eHardcodedTargetGuard': 'PASS',
              'providerWeightPolicyConsistency': 'PASS'
            },
            'releaseReady': False,
            'releaseReadyReason': 'External production/provider/device/signing gates remain separately verifiable; no source code fabricates those results.'
          }
          pathlib.Path(f'V5.1.1-KAYNAK-KOD-FINAL-{short}-PROVENANCE.json').write_text(json.dumps(payload, indent=2) + '\n')
          PY

      - name: Upload verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: V5.1.1-FINAL-SOURCE-${{ steps.commit.outputs.sha }}
          path: |
            V5.1.1-KAYNAK-KOD-FINAL-*.zip
            V5.1.1-KAYNAK-KOD-FINAL-*.zip.sha256
            V5.1.1-KAYNAK-KOD-FINAL-*-PROVENANCE.json
          if-no-files-found: error
          retention-days: 30
