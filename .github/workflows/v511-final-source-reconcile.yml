name: V5.1.1 Final Source Reconcile

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v511-final-source-reconcile.yml'

permissions:
  contents: write

jobs:
  reconcile-verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconcile verified V5.1.1 hardening sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin 1a9edc6a5508dc33d660a4924d8e8516457e40c8 093adb6d74ae4c665d2c1925239bc0097f6b0e51
          git show 093adb6d74ae4c665d2c1925239bc0097f6b0e51:.github/tmp/v511-r2-reconcile.py > /tmp/v511-r2-reconcile.py
          python - <<'PY'
          from pathlib import Path
          p = Path('/tmp/v511-r2-reconcile.py')
          s = p.read_text()
          anchor = 'FILES = [\n'
          if anchor not in s:
              raise SystemExit('R2 FILES anchor missing')
          s = s.replace(anchor, anchor + '    ".github/workflows/production-e2e.yml",\n', 1)
          p.write_text(s)
          PY
          python /tmp/v511-r2-reconcile.py

      - name: Source isolation and contract guards
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'borsa-takip-v5416-final-production.up.railway.app' .github/workflows/production-e2e.yml
          grep -q 'BORSA_E2E_BASE_URL:.*vars.BORSA_E2E_BASE_URL' .github/workflows/production-e2e.yml
          if grep -R -n -E 'dilekari-droid/v6-1-1|V6\.1\.1|v611' android backend contracts .github/scripts .github/workflows --exclude='v511-final-source-reconcile.yml'; then
            echo 'V6 source/reference contamination detected in V5.1.1 tree' >&2
            exit 1
          fi
          git diff --check

      - name: Verify backend
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt pytest pytest-asyncio
          python -m py_compile backend/main.py backend/e2e_smoke.py backend/e2e_provenance.py backend/preapk_readiness.py
          (cd backend && PYTHONPATH=. python -m pytest -q)

      - name: Verify Android source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = list(pathlib.Path('android/app/src/main/res/layout').glob('*.xml'))
          for path in files:
              ET.parse(path)
          print(f'XML parse PASS: {len(files)} files')
          PY
          ./android/gradlew -p android --no-daemon testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin

      - name: Commit verified source reconciliation
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v511-final-source-reconcile.yml
          git add -A
          git diff --cached --check
          git commit -m 'hardening: reconcile final V5.1.1 source gaps'
          NEW_SHA="$(git rev-parse HEAD)"
          echo "sha=$NEW_SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Package exact final source
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ steps.commit.outputs.sha }}'
          SHORT="${SHA:0:12}"
          ZIP="V5.1.1-KAYNAK-KOD-FINAL-${SHORT}.zip"
          git archive --format=zip --output="$ZIP" "$SHA"
          sha256sum "$ZIP" > "$ZIP.sha256"
          python - <<PY
          import json, pathlib
          sha = '${{ steps.commit.outputs.sha }}'
          short = sha[:12]
          data = {
            'repository': 'dilekari-droid/v5.1.1',
            'branch': 'main',
            'sourceCommit': sha,
            'package': f'V5.1.1-KAYNAK-KOD-FINAL-{short}.zip',
            'sourceVerification': {
              'backendPyCompile': 'PASS',
              'backendPytest': 'PASS',
              'androidUnitTest': 'PASS',
              'androidKotlinCompile': 'PASS',
              'androidTestKotlinCompile': 'PASS',
              'xmlParse': 'PASS',
              'v6IsolationGuard': 'PASS',
              'productionE2eHardcodedTargetGuard': 'PASS'
            },
            'releaseReady': False,
            'releaseReadyReason': 'External production/provider/device/signing gates are not source-code gates and remain separately verifiable.'
          }
          pathlib.Path(f'V5.1.1-KAYNAK-KOD-FINAL-{short}-PROVENANCE.json').write_text(json.dumps(data, indent=2) + '\n')
          PY

      - name: Upload final source artifact
        uses: actions/upload-artifact@v4
        with:
          name: V5.1.1-FINAL-SOURCE-${{ steps.commit.outputs.sha }}
          path: |
            V5.1.1-KAYNAK-KOD-FINAL-*.zip
            V5.1.1-KAYNAK-KOD-FINAL-*.zip.sha256
            V5.1.1-KAYNAK-KOD-FINAL-*-PROVENANCE.json
          if-no-files-found: error
          retention-days: 30
