name: V5.1.1 UI Truth Hardening

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v511-ui-truth-hardening.yml'
      - '.github/tmp/v511-ui-truth-hardening.part*'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact V5.1.1 main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Apply UI truth patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/tmp/v511-ui-truth-hardening.part0 \
              .github/tmp/v511-ui-truth-hardening.part1 \
              .github/tmp/v511-ui-truth-hardening.part2 \
              .github/tmp/v511-ui-truth-hardening.part3 \
            | base64 -d | gzip -d > /tmp/v511-ui.patch
          git apply --check /tmp/v511-ui.patch
          git apply /tmp/v511-ui.patch
          git apply --check .github/tmp/v511-ui-compile-fix.patch
          git apply .github/tmp/v511-ui-compile-fix.patch
          git diff --check

      - name: Source isolation and UI truth guards
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'dilekari-droid/v6-1-1|V6\.1\.1|v611' android backend contracts .github/scripts .github/workflows --exclude='v511-ui-truth-hardening.yml'; then
            echo 'V6 source/reference contamination detected in V5.1.1 tree' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          policy = Path('android/app/src/main/java/tr/borsatakip/v5/ui/UiTruthPolicy.kt')
          assert policy.is_file(), 'UiTruthPolicy.kt missing'
          for rel in [
              'android/app/src/main/java/tr/borsatakip/v5/ui/StocksActivity.kt',
              'android/app/src/main/java/tr/borsatakip/v5/ui/MainActivity.kt',
              'android/app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt',
              'android/app/src/main/java/tr/borsatakip/v5/ui/OpportunityActivity.kt',
              'android/app/src/main/java/tr/borsatakip/v5/ui/StockDetailActivity.kt',
          ]:
              text = Path(rel).read_text()
              assert 'UiTruthPolicy' in text, f'UiTruthPolicy not wired in {rel}'
          xml = Path('android/app/src/main/res/layout/activity_viop.xml').read_text()
          assert r'VİOP LONG\n—' in xml, 'VIOP unavailable LONG must default to dash'
          assert r'VİOP LONG\n0' not in xml, 'VIOP unavailable LONG still defaults to zero'
          print('UI truth semantic guards PASS')
          PY
          git diff --check

      - name: Verify backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r backend/requirements.txt pytest pytest-asyncio
          python -m py_compile backend/main.py backend/e2e_smoke.py backend/e2e_provenance.py backend/preapk_readiness.py
          (cd backend && PYTHONPATH=. python -m pytest -q)

      - name: Verify all Android XML
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import pathlib, xml.etree.ElementTree as ET
          files = sorted(pathlib.Path('android/app/src/main/res').rglob('*.xml'))
          for path in files:
              ET.parse(path)
          print(f'XML parse PASS: {len(files)} files')
          PY

      - name: Verify Android unit and compile gates
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin

      - name: Commit exact verified UI source
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/v511-ui-truth-hardening.yml \
                 .github/tmp/v511-ui-truth-hardening.part0 \
                 .github/tmp/v511-ui-truth-hardening.part1 \
                 .github/tmp/v511-ui-truth-hardening.part2 \
                 .github/tmp/v511-ui-truth-hardening.part3 \
                 .github/tmp/v511-ui-compile-fix.patch
          git add -A
          git diff --cached --check
          git commit -m 'ui: enforce market-data truth and responsive states'
          SHA="$(git rev-parse HEAD)"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          git push origin HEAD:main

      - name: Package exact verified source
        shell: bash
        run: |
          set -euo pipefail
          SHA='${{ steps.commit.outputs.sha }}'
          SHORT="${SHA:0:12}"
          ZIP="V5.1.1-KAYNAK-KOD-UI-FINAL-${SHORT}.zip"
          git archive --format=zip --output="$ZIP" "$SHA"
          sha256sum "$ZIP" > "$ZIP.sha256"
          python - <<PY
          import json, pathlib
          sha = '$SHA'
          short = sha[:12]
          payload = {
            'repository': 'dilekari-droid/v5.1.1',
            'branch': 'main',
            'sourceCommit': sha,
            'package': f'V5.1.1-KAYNAK-KOD-UI-FINAL-{short}.zip',
            'sourceVerification': {
              'backendPyCompile': 'PASS',
              'backendPytest': 'PASS',
              'androidUnitTest': 'PASS',
              'androidKotlinCompile': 'PASS',
              'androidTestKotlinCompile': 'PASS',
              'xmlParseAllResources': 'PASS',
              'v6IsolationGuard': 'PASS',
              'uiTruthPolicy': 'PASS',
              'noDataNotZero': 'PASS',
              'providerDataConsistency': 'PASS',
              'friendlyErrorRedaction': 'PASS',
              'responsiveTouchTargets': 'PASS_BY_SOURCE_AND_TESTS'
            },
            'releaseReady': False,
            'releaseReadyReason': 'External Railway exact-source deployment, real provider E2E, physical-device/OEM acceptance and release signing remain separate gates.'
          }
          pathlib.Path(f'V5.1.1-KAYNAK-KOD-UI-FINAL-{short}-PROVENANCE.json').write_text(json.dumps(payload, indent=2, ensure_ascii=False) + '\n')
          PY

      - name: Upload verified source artifact
        uses: actions/upload-artifact@v4
        with:
          name: V5.1.1-UI-FINAL-${{ steps.commit.outputs.sha }}
          path: |
            V5.1.1-KAYNAK-KOD-UI-FINAL-*.zip
            V5.1.1-KAYNAK-KOD-UI-FINAL-*.zip.sha256
            V5.1.1-KAYNAK-KOD-UI-FINAL-*-PROVENANCE.json
          if-no-files-found: error
          retention-days: 30
