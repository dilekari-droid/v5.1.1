name: V5.1.1 Close Open Items Apply

on:
  push:
    branches: [hardening/v511-close-open-items]
    paths:
      - '.github/tmp/v511-close-open.patch.gz.b64'
      - '.github/workflows/v511-close-open-items-apply.yml'

permissions:
  contents: write

jobs:
  verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout isolated hardening branch
        uses: actions/checkout@v4
        with:
          ref: hardening/v511-close-open-items
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply close-open patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .github/tmp/v511-close-open.patch.gz.b64 | gzip -d > /tmp/v511-close-open.patch
          git apply --check /tmp/v511-close-open.patch
          git apply /tmp/v511-close-open.patch
          git diff --check
      - name: Source hygiene and V5 isolation gates
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'dilekari-droid/v6-1-1|V6\.1\.1|v611' android backend contracts .github/scripts .github/workflows --exclude='v511-close-open-items-apply.yml'; then
            echo 'V6 reference contamination detected' >&2
            exit 1
          fi
          if grep -R -n -E 'V?5\.4\.1[0-5]' android backend contracts .github README.md --exclude-dir=build --exclude='v511-close-open-items-apply.yml'; then
            echo 'obsolete pre-final version string detected' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          roots=[Path('android'),Path('backend'),Path('contracts'),Path('.github')]
          patterns=(re.compile(r'btk_[A-Za-z0-9]{20,}'),re.compile(r"SESSION_TOKEN_SECRET\s*=\s*['\"][^'\"]+['\"]"))
          hits=[]
          for root in roots:
              for path in root.rglob('*'):
                  if not path.is_file() or path.name == 'v511-close-open.patch.gz.b64':
                      continue
                  try: text=path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError,OSError): continue
                  for lineno,line in enumerate(text.splitlines(),1):
                      if any(p.search(line) for p in patterns): hits.append(f'{path}:{lineno}')
          if hits: raise SystemExit('hardcoded secret pattern found at: '+', '.join(hits))
          print('source hygiene PASS')
          PY
      - name: Backend regression suite
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q -r backend/requirements-dev.txt
          python -m py_compile backend/main.py backend/e2e_smoke.py backend/e2e_provenance.py backend/benchmark_full_bist.py backend/preapk_readiness.py
          (cd backend && PYTHONPATH=. python -m pytest -q)
      - name: Android XML parse
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          files=sorted(Path('android/app/src/main/res').rglob('*.xml'))
          for path in files: ET.parse(path)
          print(f'XML parse PASS: {len(files)} files')
          PY
      - name: Android unit compile instrumentation-source and assembleDebug
        shell: bash
        run: |
          set -euo pipefail
          ./android/gradlew -p android --no-daemon testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin assembleDebug
      - name: Commit exact verified source changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/tmp/v511-close-open.patch.gz.b64 .github/workflows/v511-close-open-items-apply.yml
          rmdir .github/tmp 2>/dev/null || true
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'hardening: close source and final-SHA acceptance gaps'
          git push origin HEAD:hardening/v511-close-open-items
