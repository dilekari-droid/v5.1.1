name: V5.4.16 Full Hardening Source Commit R4

on:
  push:
    branches: [v5.4.16-full-hardening]
    paths:
      - '.github/workflows/v5416-full-hardening-r4-source-commit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit-verified-source-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v5.4.16-full-hardening

      - name: Reconstruct and verify exact patches
        shell: bash
        run: |
          set -euo pipefail
          cat \
            patches/v5416-full-hardening/part00.b64 \
            patches/v5416-full-hardening/part01.b64 \
            patches/v5416-full-hardening/part02.b64 \
            patches/v5416-full-hardening/part03.b64 \
            patches/v5416-full-hardening/p040.b64 \
            patches/v5416-full-hardening/p041.b64 \
            patches/v5416-full-hardening/p042.b64 \
            patches/v5416-full-hardening/p043.b64 \
            patches/v5416-full-hardening/part05.b64 \
            patches/v5416-full-hardening/part06.b64 \
            patches/v5416-full-hardening/part07.b64 \
            | base64 -d | gzip -d > /tmp/V5.4.16-FULL-HARDENING.patch
          echo '0b1c0f09306dcece86539896157167db178b2a401aa85b9d838753ffcd47a2af  /tmp/V5.4.16-FULL-HARDENING.patch' | sha256sum -c -
          echo 'fd36ab7b8918b7d4c96b36a41ff41e9ede74f82b706cd5ccd7377e0ccd00312e  patches/v5416-full-hardening/compile-fix.patch' | sha256sum -c -
          git apply --check /tmp/V5.4.16-FULL-HARDENING.patch
          git apply /tmp/V5.4.16-FULL-HARDENING.patch
          git apply --check patches/v5416-full-hardening/compile-fix.patch
          git apply patches/v5416-full-hardening/compile-fix.patch
          git diff --check

      - name: Commit only previously verified source files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V5.4.16 Full Hardening CI'
          git config user.email 'actions@users.noreply.github.com'
          git add android backend contracts README.md
          git diff --cached --check
          git commit -m 'V5.4.16 full production source hardening'
          git push origin HEAD:v5.4.16-full-hardening
