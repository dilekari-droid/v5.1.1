name: V5.4.16 Production E2E Smoke

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Initialize redacted production E2E preflight evidence
        shell: bash
        env:
          BORSA_E2E_BASE_URL: ${{ vars.BORSA_E2E_BASE_URL || secrets.BORSA_E2E_BASE_URL }}
          BORSA_E2E_EXPECTED_REVISION: ${{ github.sha }}
          BORSA_E2E_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone

          evidence = {
              "schemaVersion": 1,
              "sourceCommit": os.environ["BORSA_E2E_EXPECTED_REVISION"],
              "githubRunId": os.environ["BORSA_E2E_RUN_ID"],
              "timestampUtc": datetime.now(timezone.utc).isoformat(),
              "baseUrlConfigured": bool(os.environ.get("BORSA_E2E_BASE_URL", "").strip()),
              "status": "PRECHECK",
          }
          with open("production-e2e-preflight.json", "w", encoding="utf-8") as fh:
              json.dump(evidence, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
      - name: Install smoke dependencies
        run: python -m pip install 'httpx==0.28.1'
      - name: Verify deployed source provenance
        shell: bash
        env:
          BORSA_E2E_BASE_URL: ${{ vars.BORSA_E2E_BASE_URL || secrets.BORSA_E2E_BASE_URL }}
          BORSA_E2E_EXPECTED_REVISION: ${{ github.sha }}
          BORSA_E2E_PROVENANCE_ARTIFACT_PATH: production-e2e-provenance.json
        run: |
          set -euo pipefail
          if [ -z "${BORSA_E2E_BASE_URL:-}" ]; then
            printf '%s\n' 'CONFIGURATION FAILED: BORSA_E2E_BASE_URL is not configured' | tee production-e2e-provenance.log
            python - <<'PY'
          import json
          path = "production-e2e-preflight.json"
          data = json.load(open(path, encoding="utf-8"))
          data["status"] = "CONFIGURATION_FAILED"
          data["reason"] = "BORSA_E2E_BASE_URL_NOT_CONFIGURED"
          with open(path, "w", encoding="utf-8") as fh:
              json.dump(data, fh, indent=2, sort_keys=True)
              fh.write("\n")
          PY
            exit 2
          fi
          python backend/e2e_provenance.py 2>&1 | tee production-e2e-provenance.log
      - name: Run production E2E contract smoke
        shell: bash
        env:
          BORSA_E2E_BASE_URL: ${{ vars.BORSA_E2E_BASE_URL || secrets.BORSA_E2E_BASE_URL }}
          BORSA_E2E_API_KEY: ${{ secrets.BORSA_E2E_API_KEY }}
          BORSA_E2E_INSTALL_ID: github-actions-v5416-e2e
          BORSA_E2E_EXPECTED_REVISION: ${{ github.sha }}
          BORSA_E2E_SOURCE_COMMIT: ${{ github.sha }}
          BORSA_E2E_EVIDENCE_PATH: production-e2e-evidence.json
          BORSA_E2E_COMMIT_SHA: ${{ github.sha }}
          BORSA_E2E_ARTIFACT_PATH: production-e2e-evidence.json
        run: |
          set -euo pipefail
          python backend/e2e_smoke.py 2>&1 | tee production-e2e.log
      - name: Preserve production E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5.4.16-PRODUCTION-E2E-${{ github.run_id }}
          path: |
            production-e2e-preflight.json
            production-e2e-provenance.log
            production-e2e-provenance.json
            production-e2e.log
            production-e2e-evidence.json
          if-no-files-found: error
          retention-days: 30

# verification-trigger: exact-live-revision-redacted-evidence-v5
