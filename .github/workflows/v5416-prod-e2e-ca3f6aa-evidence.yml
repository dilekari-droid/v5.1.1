name: V5.4.16 Frozen Production E2E Evidence

on:
  push:
    branches:
      - evidence/v5.4.16-prod-e2e-ca3f6aa
    paths:
      - '.github/workflows/v5416-prod-e2e-ca3f6aa-evidence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frozen-live-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact frozen source
        uses: actions/checkout@v4
        with:
          ref: ca3f6aa32279fd03ef9c0df279df4ab37f49ca9c
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install smoke dependencies
        run: python -m pip install 'httpx==0.28.1'

      - name: Verify deployed source provenance
        shell: bash
        env:
          BORSA_E2E_BASE_URL: https://borsa-takip-v5416-final-production.up.railway.app
          BORSA_E2E_EXPECTED_REVISION: ca3f6aa32279fd03ef9c0df279df4ab37f49ca9c
          BORSA_E2E_DEPLOYMENT_REVISION: ${{ vars.BORSA_E2E_DEPLOYMENT_REVISION }}
          BORSA_E2E_PROVENANCE_ARTIFACT_PATH: production-e2e-provenance.json
        run: |
          set -euo pipefail
          python backend/e2e_provenance.py 2>&1 | tee production-e2e-provenance.log

      - name: Run production E2E contract smoke
        shell: bash
        env:
          BORSA_E2E_BASE_URL: https://borsa-takip-v5416-final-production.up.railway.app
          BORSA_E2E_API_KEY: ${{ secrets.BORSA_E2E_API_KEY }}
          BORSA_E2E_INSTALL_ID: github-actions-v5416-frozen-ca3f6aa
          BORSA_E2E_EXPECTED_REVISION: ca3f6aa32279fd03ef9c0df279df4ab37f49ca9c
          BORSA_E2E_SOURCE_COMMIT: ca3f6aa32279fd03ef9c0df279df4ab37f49ca9c
          BORSA_E2E_EVIDENCE_PATH: production-e2e-evidence.json
          BORSA_E2E_COMMIT_SHA: ca3f6aa32279fd03ef9c0df279df4ab37f49ca9c
          BORSA_E2E_DEPLOYMENT_REVISION: ${{ vars.BORSA_E2E_DEPLOYMENT_REVISION }}
          BORSA_E2E_ARTIFACT_PATH: production-e2e-evidence.json
        run: |
          set -euo pipefail
          python backend/e2e_smoke.py 2>&1 | tee production-e2e.log

      - name: Preserve frozen production E2E evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V5.4.16-FROZEN-PRODUCTION-E2E-${{ github.run_id }}
          path: |
            production-e2e-provenance.log
            production-e2e-provenance.json
            production-e2e.log
            production-e2e-evidence.json
          if-no-files-found: warn
          retention-days: 30
