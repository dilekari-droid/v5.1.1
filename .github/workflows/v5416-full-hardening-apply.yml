name: V5.4.16 Full Hardening Source Verify

on:
  push:
    branches: [v5.4.16-full-hardening]
    paths:
      - '.github/workflows/v5416-full-hardening-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify-and-publish-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: v5.4.16-full-hardening

      - name: Reconstruct, checksum and apply hardening patch
        shell: bash
        run: |
          set -euo pipefail
          cat patches/v5416-full-hardening/part*.b64 | base64 -d | gzip -d > /tmp/V5.4.16-FULL-HARDENING.patch
          echo '0b1c0f09306dcece86539896157167db178b2a401aa85b9d838753ffcd47a2af  /tmp/V5.4.16-FULL-HARDENING.patch' | sha256sum -c -
          git apply --check /tmp/V5.4.16-FULL-HARDENING.patch
          git apply /tmp/V5.4.16-FULL-HARDENING.patch
          git diff --check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements-dev.txt

      - name: Backend compile, contract and Docker verification
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements-dev.txt
          python -m py_compile backend/main.py backend/e2e_smoke.py backend/tests/test_contracts.py backend/tests/test_android_backend_route_contract.py
          (cd backend && PYTHONPATH=. pytest -q)
          docker build -t borsatakip-v5416-full-hardening ./backend

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Android tests, source compile and verification APK assembly
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon clean testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin assembleDebug

      - name: Verify debug APK package, signature, alignment and secrets
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find android/app/build/outputs/apk/debug -type f -name '*.apk' | head -1)"
          test -f "$APK"
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          BUILD_TOOLS="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          BADGING="$($BUILD_TOOLS/aapt dump badging "$APK" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -q "package: name='tr.borsatakip.v5'"
          echo "$BADGING" | grep -q "versionCode='556'"
          echo "$BADGING" | grep -q "versionName='5.4.16'"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          mkdir -p /tmp/apk-unpack
          unzip -q "$APK" -d /tmp/apk-unpack
          ! grep -R -a --line-number -E 'btk_[A-Za-z0-9]{8,}' /tmp/apk-unpack
          sha256sum "$APK" | tee /tmp/debug-apk.sha256
          cp "$APK" /tmp/V5.4.16-DEBUG-APK-CI-VERIFICATION-ONLY.apk

      - name: Hardening acceptance gates
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'versionCode = 556' android/app/build.gradle.kts
          grep -q 'versionName = "5.4.16"' android/app/build.gradle.kts
          grep -q 'BistScanServiceLifecyclePolicy' android/app/src/main/java/tr/borsatakip/v5/worker/BistScanForegroundService.kt
          grep -q 'BistScanStartGate' android/app/src/main/java/tr/borsatakip/v5/ui/BistScanActivity.kt
          grep -q 'BistScanStartGate' android/app/src/main/java/tr/borsatakip/v5/ui/OpportunityActivity.kt
          grep -q 'FINALIZING' android/app/src/main/java/tr/borsatakip/v5/data/ManualScanSession.kt
          grep -q 'ManualScanResultRepository' android/app/src/main/java/tr/borsatakip/v5/data/ManualScanResultRepository.kt
          grep -q 'BackendRequestSecurity' android/app/src/main/java/tr/borsatakip/v5/data/BackendRequestSecurity.kt
          grep -q 'shortLivedSessionAuth' contracts/api-v1.md
          grep -q '/v1/tradingview/signals' contracts/routes-v1.json
          grep -q '/v1/research/foundation' contracts/routes-v1.json
          grep -q '/v1/auth/session' contracts/routes-v1.json
          grep -q 'discover_android_routes' backend/tests/test_android_backend_route_contract.py
          ! grep -R --line-number --exclude-dir=build -E 'btk_[A-Za-z0-9]{8,}' android backend contracts
          ! grep -R --line-number -E 'V5\.4\.(6|7)' android/app/src/main android/app/src/test android/app/src/androidTest

      - name: Commit verified source hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'V5.4.16 Full Hardening CI'
          git config user.email 'actions@users.noreply.github.com'
          git add android backend contracts README.md \
            .github/workflows/android-build.yml \
            .github/workflows/backend-ci.yml \
            .github/workflows/production-e2e.yml
          git diff --cached --check
          git commit -m 'V5.4.16 full production hardening and contract closure'
          git push origin HEAD:v5.4.16-full-hardening

      - name: Create verified source-only deliverable
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v5416-source
          git archive --format=zip \
            --output=/tmp/v5416-source/V5.4.16-KAYNAK-KOD-FULL-HARDENING.zip \
            HEAD android backend contracts README.md \
            .github/workflows/android-build.yml \
            .github/workflows/backend-ci.yml \
            .github/workflows/production-e2e.yml
          cd /tmp/v5416-source
          unzip -t V5.4.16-KAYNAK-KOD-FULL-HARDENING.zip
          sha256sum V5.4.16-KAYNAK-KOD-FULL-HARDENING.zip | tee V5.4.16-KAYNAK-KOD-FULL-HARDENING.zip.sha256
          cat > provenance.txt <<'EOF'
          VERSION_CODE=556
          VERSION_NAME=5.4.16
          BACKEND_TESTS=PASS
          ANDROID_UNIT_TESTS=PASS
          KOTLIN_COMPILE=PASS
          ANDROID_TEST_SOURCE_COMPILE=PASS
          DEBUG_APK_VERIFY=PASS
          ROUTE_AUTO_DISCOVERY=PASS
          MANUAL_SCAN_ATOMIC_COMPLETION=PASS
          FOREGROUND_SHUTDOWN_RACE_GUARD=PASS
          PROGRESS_PERSISTENCE_THROTTLED=PASS
          CENTRAL_BAR_LIMITER_CACHE=PASS
          SNAPSHOT_QUOTE_RESOLVER_SHARED=PASS
          RANGE_MAX=SUPPORTED
          TRADINGVIEW_RESEARCH=CAPABILITY_FAIL_CLOSED
          VIOP_METADATA=FAIL_CLOSED_UNLESS_CONFIGURED
          SHORT_LIVED_SESSION_AUTH=IMPLEMENTED_OPTIONAL
          REALTIME_ATTESTATION=FAIL_CLOSED
          FULL_BIST_5MIN_SLA=NOT_CLAIMED
          E2E_LIVE=NOT_RUN_REQUIRES_SECRETS
          FINAL_APK=NOT_PUBLISHED
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: V5.4.16-FULL-HARDENING-SOURCE
          path: /tmp/v5416-source/
          if-no-files-found: error
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: V5.4.16-DEBUG-APK-CI-VERIFICATION-ONLY
          path: |
            /tmp/V5.4.16-DEBUG-APK-CI-VERIFICATION-ONLY.apk
            /tmp/debug-apk.sha256
          if-no-files-found: error
          retention-days: 14
