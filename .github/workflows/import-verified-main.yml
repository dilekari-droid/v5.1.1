name: Import verified BorsaTakipV5 source snapshot

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/import-verified-main.yml'

permissions:
  contents: write
  actions: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout target repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Import exact verified non-workflow source snapshot
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_REPO='dilekari-droid/BorsaTakipV5-Production'
          SOURCE_SHA='93207d7620a29d90e7571f1309dd4a851e1b8d4c'
          SOURCE_TREE='fd53a4aa5fb8543b845c7ab1eab4a428362d3070'

          rm -rf /tmp/v5416-source
          git clone --filter=blob:none --no-checkout "https://github.com/${SOURCE_REPO}.git" /tmp/v5416-source
          git -C /tmp/v5416-source fetch --depth=1 origin "${SOURCE_SHA}"
          git -C /tmp/v5416-source checkout --detach "${SOURCE_SHA}"
          test "$(git -C /tmp/v5416-source rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git -C /tmp/v5416-source rev-parse HEAD^{tree})" = "${SOURCE_TREE}"

          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/v5416-source/ ./

          rsync -ani --delete --checksum --exclude='.git/' --exclude='.github/workflows/' /tmp/v5416-source/ ./ > /tmp/import-diff.txt
          if test -s /tmp/import-diff.txt; then
            cat /tmp/import-diff.txt >&2
            echo 'Non-workflow source mismatch after import.' >&2
            exit 1
          fi

          if find . -type f \( -name '*.apk' -o -name '*.aab' -o -name '*.jks' -o -name '*.keystore' -o -name 'local.properties' \) -print -quit | grep -q .; then
            echo 'Forbidden binary/secret-adjacent artifact found after import.' >&2
            exit 1
          fi

          git add -A
          git diff --cached --name-only -- '.github/workflows/' | grep -q . && {
            echo 'Workflow files must not be changed by the Actions migration step.' >&2
            exit 1
          } || true

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m "Import verified non-workflow source snapshot ${SOURCE_SHA}"
          git push origin HEAD:main
