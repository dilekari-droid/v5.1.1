name: V5.1.1 VIOP Unavailable Fix Verify

on:
  push:
    branches: [hardening/v511-viop-unavailable-fix]
    paths:
      - '.github/workflows/v511-viop-unavailable-fix-verify.yml'

permissions:
  contents: write

jobs:
  apply-and-source-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v511-viop-unavailable-fix
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Apply fail-closed VIOP counter fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt')
          s = p.read_text(encoding='utf-8')
          old = '''        findViewById<TextView>(R.id.summaryLong).text = "LONG EĞİLİMİ\\n$longs"\n        findViewById<TextView>(R.id.summaryShort).text = "SHORT EĞİLİMİ\\n$shorts"\n        findViewById<TextView>(R.id.summaryWatch).text = "NÖTR\\n$neutral"\n        findViewById<TextView>(R.id.summaryTotal).text = "TARANAN DAYANAK\\n${source.size}"\n'''
          new = '''        // Dayanak ön taraması gerçek VİOP kontrat/sinyal sonucu değildir.\n        // Provider doğrulanmadan ana VİOP sayaçlarında sayısal sonuç göstermeyiz.\n        findViewById<TextView>(R.id.summaryLong).text = "VİOP LONG\\n—"\n        findViewById<TextView>(R.id.summaryShort).text = "VİOP SHORT\\n—"\n        findViewById<TextView>(R.id.summaryWatch).text = "İZLE\\n—"\n        findViewById<TextView>(R.id.summaryTotal).text = "TARANAN\\n—"\n'''
          old2 = '''        findViewById<TextView>(R.id.signalSummary).text = buildString {\n            append("${source.size} dayanak • DAYANAK ÖN TARAMA")\n            average?.let { append(" • Ortalama sıralama %${it.toInt().coerceIn(0, 100)}") }\n        }\n'''
          new2 = '''        findViewById<TextView>(R.id.signalSummary).text = buildString {\n            append("DAYANAK ÖN TARAMA • gerçek VİOP sinyali değildir")\n            append("\\n${source.size} dayanak: LONG eğilimi $longs • SHORT eğilimi $shorts • Nötr $neutral")\n            average?.let { append(" • Ortalama sıralama %${it.toInt().coerceIn(0, 100)}") }\n        }\n'''
          if old not in s or old2 not in s:
              raise SystemExit('expected VIOP summary blocks not found')
          s = s.replace(old, new, 1).replace(old2, new2, 1)
          p.write_text(s, encoding='utf-8')
          PY
          git diff --check
          grep -F 'findViewById<TextView>(R.id.summaryLong).text = "VİOP LONG\n—"' android/app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt
          grep -F 'DAYANAK ÖN TARAMA • gerçek VİOP sinyali değildir' android/app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt
      - name: Source compile and unit acceptance
        shell: bash
        run: ./android/gradlew -p android --no-daemon testDebugUnitTest compileDebugKotlin compileDebugAndroidTestKotlin assembleDebug
      - name: Commit verified source fix to hardening branch
        shell: bash
        run: |
          set -euo pipefail
          git add android/app/src/main/java/tr/borsatakip/v5/ui/ViopActivity.kt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: keep VIOP counters unavailable during underlying pre-scan'
          git push origin HEAD:hardening/v511-viop-unavailable-fix

  instrumentation:
    needs: apply-and-source-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        api-level: [31, 33, 34, 35]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v511-viop-unavailable-fix
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle wrapper integrity gate
        shell: bash
        run: |
          set -euo pipefail
          test -x android/gradlew
          test -s android/gradlew.bat
          test -s android/gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8.11.1-bin.zip' android/gradle/wrapper/gradle-wrapper.properties
      - name: Enable KVM when available
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm || true; fi
      - name: Run lifecycle/UI instrumentation on API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-metrics
          script: bash .github/scripts/run-v5416-instrumentation.sh

  cleanup-verifier:
    needs: instrumentation
    if: success()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/v511-viop-unavailable-fix
          fetch-depth: 0
      - name: Remove temporary verifier
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v511-viop-unavailable-fix-verify.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: remove temporary VIOP fix verifier'
          git push origin HEAD:hardening/v511-viop-unavailable-fix
